name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Looks for real defects (undefined names, unused imports, likely bugs),
    # not style. Formatting is deliberately not enforced here: `ruff format`
    # is available locally, but a red build over whitespace helps nobody.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    # Deliberately four jobs, not a full matrix. Linux covers both ends of
    # the README's "Python 3.11 or newer" promise; the other two platforms
    # run the current version only. Windows earns its place because nobody
    # can test it by hand and it is where this project's code really
    # differs: filenames rejecting characters that are legal elsewhere, a
    # case-insensitive filesystem that affects resume-by-filename, and files
    # that cannot be replaced while open (the .part rename and the ffmpeg
    # temp file). macOS is the platform end users are most likely to share
    # with the owner, so it gets a clean-machine run instead of relying only
    # on his local one. Runners are free on public repositories; on a
    # private fork macOS minutes cost about ten times Linux ones, so this is
    # the first job to reconsider if that ever changes.
    # GUI code is verified manually - runners have no display, and the plan
    # keeps GUI logic out of the tests.
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  secrets:
    # Enforces the hard rule in AGENTS.md: credentials, Telethon sessions and
    # downloaded media must never be tracked. A .session file grants full
    # access to the owner's Telegram account, so this failing is an incident,
    # not a style problem.
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for forbidden tracked files
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\.env$|\.session(-journal)?$|^downloads/' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::These files must never be committed:"
            echo "$forbidden"
            exit 1
          fi
          echo "No credentials, sessions or downloads are tracked."
