name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Looks for real defects (undefined names, unused imports, likely bugs),
    # not style. Formatting is deliberately not enforced here: `ruff format`
    # is available locally, but a red build over whitespace helps nobody.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    # The app must behave identically on macOS and Windows (see
    # docs/DECISIONS.md), and the README promises Python 3.11 or newer, so
    # both ends of that promise are exercised. GUI code is verified by hand:
    # runners have no display, and the plan keeps GUI logic out of the tests.
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  secrets:
    # Enforces the hard rule in AGENTS.md: credentials, Telethon sessions and
    # downloaded media must never be tracked. A .session file grants full
    # access to the owner's Telegram account, so this failing is an incident,
    # not a style problem.
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for forbidden tracked files
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\.env$|\.session(-journal)?$|^downloads/' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::These files must never be committed:"
            echo "$forbidden"
            exit 1
          fi
          echo "No credentials, sessions or downloads are tracked."
